<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Control de Kilometraje</title>

  <link rel="stylesheet" href="./css/style.css" />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>
  <div class="container">

    <header>
      <h1>Control de Kilometraje</h1>
      <p>Registro diario de vehículos, placas, proyectos y conductores</p>
    </header>

    <section class="resumen">
      <div>
        <span>Total registros</span>
        <h2 id="totalRegistros">0</h2>
      </div>

      <div>
        <span>Total KM</span>
        <h2 id="totalKm">0</h2>
      </div>
    </section>

    <section class="card">
      <h2>Nuevo registro</h2>

      <form id="formRegistro" class="form-grid">

        <div class="form-group">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" required />
        </div>

        <div class="form-group">
          <label for="vehiculo">Vehículo</label>
          <select id="vehiculo" required>
            <option value="">Cargando vehículos...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="placa">Placa</label>
          <input type="text" id="placa" readonly />
        </div>

        <div class="form-group">
          <label for="proyecto">Proyecto</label>
          <select id="proyecto" required>
            <option value="">Cargando proyectos...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="conductor">Conductor</label>
          <select id="conductor" required>
            <option value="">Cargando conductores...</option>
          </select>
        </div>

        <div class="form-group">
          <label for="kmInicial">KM Inicial</label>
          <input type="number" id="kmInicial" min="0" step="0.01" required />
        </div>

        <div class="form-group">
          <label for="kmFinal">KM Final</label>
          <input type="number" id="kmFinal" min="0" step="0.01" required />
        </div>

        <div class="form-group">
          <label for="totalKilometraje">Total KM</label>
          <input type="number" id="totalKilometraje" readonly />
        </div>

        <button type="submit" class="full">Guardar registro</button>

      </form>
    </section>

    <section class="card">
      <div class="title-row">
        <h2>Reporte</h2>
        <button type="button" id="btnLimpiar" class="danger">Limpiar todo</button>
      </div>

      <input
        type="text"
        id="buscar"
        placeholder="Buscar por fecha, vehículo, placa, proyecto o conductor..."
      />

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Fecha</th>
              <th>Vehículo</th>
              <th>Placa</th>
              <th>Proyecto</th>
              <th>KM Inicial</th>
              <th>KM Final</th>
              <th>Total KM</th>
              <th>Conductor</th>
            </tr>
          </thead>

          <tbody id="tabla"></tbody>
        </table>
      </div>
    </section>

  </div>

  <script src="./js/script.js"></script>
</body>
</html>
