<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Control de Kilometraje</title>

  <link rel="stylesheet" href="./css/style.css" />

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div class="background-overlay"></div>

  <div class="container">

    <header class="hero">
      <div class="hero-content">
        <h1>
          <i class="fa-solid fa-truck-fast"></i>
          Control de Kilometraje
        </h1>

        <p>
          ANTES DE GUARDAR FAVOR VERIFICAR KILOMETRAJE ...¡GRACIAS!
        </p>
      </div>
    </header>

    <section class="resumen">

      <div class="resumen-card">
        <i class="fa-solid fa-file-lines"></i>

        <div>
          <span>Total registros</span>
          <h2 id="totalRegistros">0</h2>
        </div>
      </div>

      <div class="resumen-card">
        <i class="fa-solid fa-road"></i>

        <div>
          <span>Total KM</span>
          <h2 id="totalKm">0</h2>
        </div>
      </div>

    </section>

    <section class="card">

      <div class="card-title">
        <i class="fa-solid fa-clipboard-list"></i>
        <h2>Nuevo Registro</h2>
      </div>

      <form id="formRegistro" class="form-grid">

        <div class="form-group">
          <label>Fecha</label>
          <input type="date" id="fecha" required />
        </div>

        <div class="form-group">
          <label>Vehículo</label>

          <select id="vehiculo" required>
            <option value="">Cargando vehículos...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Placa</label>
          <input type="text" id="placa" readonly />
        </div>

        <div class="form-group">
          <label>Proyecto</label>

          <select id="proyecto" required>
            <option value="">Cargando proyectos...</option>
          </select>
        </div>

        <div class="form-group">
          <label>Conductor</label>

          <select id="conductor" required>
            <option value="">Cargando conductores...</option>
          </select>
        </div>

        <div class="form-group">
          <label>KM Inicial</label>

          <input
            type="text"
            id="kmInicial"
            maxlength="6"
            inputmode="numeric"
            required
          />
        </div>

        <div class="form-group">
          <label>KM Final</label>

          <input
            type="text"
            id="kmFinal"
            maxlength="6"
            inputmode="numeric"
            required
          />
        </div>

        <div class="form-group">
          <label>Total KM</label>
          <input type="text" id="totalKilometraje" readonly />
        </div>

        <button type="submit" class="btn-guardar">
          <i class="fa-solid fa-floppy-disk"></i>
          Guardar Registro
        </button>

      </form>
    </section>

    <section class="card">

      <div class="card-title">
        <i class="fa-solid fa-chart-column"></i>
        <h2>Reporte de Registros</h2>
      </div>

      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>

        <input
          type="text"
          id="buscar"
          placeholder="Buscar por vehículo, placa, proyecto o conductor..."
        />
      </div>

      <div class="table-wrapper">

        <table>

          <thead>
            <tr>
              <th>Fecha</th>
              <th>Vehículo</th>
              <th>Placa</th>
              <th>Proyecto</th>
              <th>KM Inicial</th>
              <th>KM Final</th>
              <th>Total KM</th>
              <th>Conductor</th>
            </tr>
          </thead>

          <tbody id="tabla"></tbody>

        </table>

      </div>

    </section>

  </div>

  <a
    href="https://wa.me/50685548880"
    class="whatsapp-float"
    target="_blank"
  >
    <i class="fa-brands fa-whatsapp"></i>
  </a>

  <script src="./js/script.js"></script>

</body>
</html>
